# Render.com blueprint (free web service + free static site). Secrets are NOT stored here:
# every `sync: false` variable is entered in the Render dashboard.
services:
  - type: web
    name: sakhiai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: DEFAULT_AI_PROVIDER, value: gemini }
      - { key: GEMINI_MODEL, value: gemini-3.5-flash }
      - { key: GEMINI_FALLBACK_MODEL, value: gemini-3.1-flash-lite }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: MONGODB_URI, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }   # e.g. https://sakhiai.onrender.com
      - { key: APP_URL, sync: false }
      - { key: GOOGLE_MAPS_API_KEY, sync: false }
      - { key: NOTIFY_WEBHOOK_URLS, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: VAPID_PUBLIC_KEY, sync: false }
      - { key: VAPID_PRIVATE_KEY, sync: false }
      - { key: VAPID_SUBJECT, sync: false }
  - type: web
    name: sakhiai-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - { key: VITE_API_BASE_URL, sync: false }       # https://sakhiai-backend.onrender.com
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    headers:
      - { path: /sw.js, name: Cache-Control, value: no-cache }
