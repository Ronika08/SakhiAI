# Local full-stack run:  docker compose up --build
# Secrets are read from backend/.env (never committed). Create it from backend/env.example.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/sakhiai
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      APP_URL: http://localhost:8080
    depends_on: [mongo]
    ports: ["5000:5000"]
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000
    restart: unless-stopped
    ports: ["8080:80"]
volumes:
  mongo-data:
